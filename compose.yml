services:
  nginx:
    image: nginx:1.31.6-alpine3.24
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./php:/var/www/html
    depends_on:
      - php
    networks:
      - process_network

  php:
    image: php:8.2.33-fpm-alpine3.24
    volumes:
      - ./php:/var/www/html

  db:
    image: rogue260921/mariadb:11.8.8-r0-alpine3.24
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lampdb
      MYSQL_USER: lampuser
      MYSQL_PASSWORD: lamppassword
    volumes:
      - db_data:/var/lib/mariadb
    networks:
      - process_network

volumes:
  db_data:

networks:
  process_network:
    driver: bridge
