services:
  nginx:
    image: nginx:1.31.6-alpine3.24
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./php:/var/www/html
    depends_on:
      - php-fpm

  php-fpm:
    image: php:8.2.33-fpm-alpine3.24
    volumes:
      - ./php:/var/www/html

  mariadb:
    image: rogue260921/mariadb:11.8.8-r0-alpine3.24
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: myapp
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
