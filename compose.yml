services:
  nginx:
    image: nginx:1.31.6-alpine3.24
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./php:/var/www/html
    depends_on:
      - php
    networks:
      - process_network

  php:
    build:
      context: ./php
      dockerfile: Containerfile
    volumes:
      - ./php:/var/www/html
    networks:
      - process_network

  db:
    image: docker.io/rogue260921/mariadb:11.8.8-r0-alpine3.24
    networks:
      - process_network

volumes:
  db_data:

networks:
  process_network:
    driver: bridge
